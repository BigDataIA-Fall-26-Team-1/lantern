name: smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1
        
      - name: Python packages
        run: pip install -r requirements.txt

      - name: Part 1 text extraction on fixtures
        run: python src/parse_text.py --input tests/fixtures --output /tmp/parsed

      - name: Part 2 tables on fixtures
        run: python src/tables.py --input tests/fixtures --output /tmp/tables

      - name: Tests
        run: pytest -q
