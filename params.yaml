download:
  ticker: AAPL
  forms: ["10-K"]
  after: "2024-01-01"
  before: "2026-01-01"
  user_agent_name: "NEU-DAMG7245-Fall26-Team1"
  user_agent_email: "praveen.p@northeastern.edu"

render:
  page_format: Letter

text:
  x_tolerance: 1.5
  y_tolerance: 3

ocr:
  min_chars: 50
  junk_ratio: 0.3
  dpi: 300
  image_coverage: 0.6
  tesseract_config: "--oem 1 --psm 6"

tables:
  min_rulings: 6              # existing: this many long rules = "ruled" page, try lattice first
  accept_score: 80            # existing: accuracy - whitespace_weight * whitespace
  statements:
    income: ["CONSOLIDATED STATEMENTS OF OPERATIONS"]
    comprehensive_income: ["CONSOLIDATED STATEMENTS OF COMPREHENSIVE INCOME"]
    balance: ["CONSOLIDATED BALANCE SHEETS"]
    equity: ["CONSOLIDATED STATEMENTS OF SHAREHOLDERS"]
    cash_flows: ["CONSOLIDATED STATEMENTS OF CASH FLOWS"]
  title_top_lines: 6          # title must be in a page's first lines (skips table of contents)
  min_numeric_tokens: 20      # was 40; comprehensive income is a short statement
  title_max_extra_chars: 15   # title must be nearly the whole line (rejects index pages)
  rule_min_len_pt: 100        # only rules this long count (ignores underlines under totals)
  order_ruled: [lattice, network, stream]
  order_borderless: [stream, network, lattice]
  whitespace_weight: 0.5
  min_rows: 5                 # fragment guard
  min_cols: 3
  min_coverage: 0.5           # table must hold at least half the page's numbers
  max_label_merge: 0.2        # max share of labels ending in a number (shifted columns)
  bakeoff_flavors: [lattice, stream, network, hybrid]
  run_bakeoff: true
  scale_words: {thousands: 1000, millions: 1000000, billions: 1000000000}
  shares_pattern: "shares used|weighted.average.*shares|number of shares"
  per_share_pattern: "per share|per-share"

layout:
  model: "lp://efficientdet/PubLayNet"
  score_threshold: 0.5
  pad_pt: 8

managed:
  enabled: false
  provider: ""

  
docling:
  do_ocr: false
  table_mode: accurate
  html_stem: AAPL_10K_20240928