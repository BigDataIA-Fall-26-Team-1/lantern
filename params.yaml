download:
  ticker: AAPL
  forms: ["10-K"]
  after: "2024-01-01"
  before: "2026-01-01"
  user_agent_name: "NEU-DAMG7245-Fall26-Team1"
  user_agent_email: "praveen.p@northeastern.edu"

render:
  page_format: Letter

text:
  x_tolerance: 1.5
  y_tolerance: 3

ocr:
  min_chars: 50
  junk_ratio: 0.3
  dpi: 300
  image_coverage: 0.6
  tesseract_config: "--oem 1 --psm 6"

tables:
  min_rulings: 6              # existing: this many long rules = "ruled" page, try lattice first
  accept_score: 80            # existing: accuracy - whitespace_weight * whitespace
  statements:
    income: ["CONSOLIDATED STATEMENTS OF OPERATIONS"]
    comprehensive_income: ["CONSOLIDATED STATEMENTS OF COMPREHENSIVE INCOME"]
    balance: ["CONSOLIDATED BALANCE SHEETS"]
    equity: ["CONSOLIDATED STATEMENTS OF SHAREHOLDERS"]
    cash_flows: ["CONSOLIDATED STATEMENTS OF CASH FLOWS"]
  title_top_lines: 6          # title must be in a page's first lines (skips table of contents)
  min_numeric_tokens: 20      # was 40; comprehensive income is a short statement
  title_max_extra_chars: 15   # title must be nearly the whole line (rejects index pages)
  rule_min_len_pt: 100        # only rules this long count (ignores underlines under totals)
  order_ruled: [lattice, network, stream]
  order_borderless: [stream, network, lattice]
  whitespace_weight: 0.5
  min_rows: 5                 # fragment guard
  min_cols: 3
  min_coverage: 0.5           # table must hold at least half the page's numbers
  max_label_merge: 0.2        # max share of labels ending in a number (shifted columns)
  bakeoff_flavors: [lattice, stream, network, hybrid]
  run_bakeoff: true
  scale_words: {thousands: 1000, millions: 1000000, billions: 1000000000}
  shares_pattern: "shares used|weighted.average.*shares|number of shares"
  per_share_pattern: "per share|per-share"

layout:
  model: "lp://efficientdet/PubLayNet"
  score_threshold: 0.25             # your corrected value
  pad_pt: 8
  model_name: "tf_efficientdet_d0"
  hf_repo: "layoutparser/efficientdet"
  hf_file: "PubLayNet/tf_efficientdet_d0/publaynet-tf_efficientdet_d0.pth.tar"
  table_min_cols: 2                 # layout tables can be narrow (label + one value column)
  table_min_coverage: 0.3           # TOC and note tables hold numbers in the label column
  table_region_overlap: 0.8         # a returned table must lie this much inside the asked region
  table_snap_pt: 40                 # pull row labels within this distance into the table
  text_snap_pt: 15                  # pull clipped words within this distance into a text block
  dpi: 150                          # page image resolution for the detector
  duplicate_cover_ratio: 0.6        # drop a box this much covered by better boxes of the same type
  inside_table_ratio: 0.8           # drop a non-table box this much inside a table
  full_width_ratio: 0.6             # wider than this share of the page = spans both columns
  table_min_rows: 2                 # layout tables can be small (Part 2 statements use min_rows)
  fallback_y_tol_pt: 3              # words within this vertical gap are on one line
  fallback_word_gap_pt: 20          # a bigger horizontal gap starts a new column
  fallback_line_gap_pt: 6           # lines this close merge into one fallback block
  fallback_min_chars: 3             # ignore tiny leftovers (page numbers)
  tesseract_config: "--oem 1 --psm 6"

managed:
  enabled: false
  provider: aws-textract
  region: us-east-1
  api: AnalyzeDocument
  features: [TABLES, LAYOUT]
  ocr_conf_threshold: 70

docling:
  do_ocr: false
  table_mode: accurate
  html_stem: AAPL_10K_20240928

export:
  item_heading_max_chars: 150
  footer_pattern: '(\|\s*\d{4}\s+Form\s+10-[KQ]\s*\|\s*\d+|^\s*\d{1,3})\s*$'
  footer_line_pattern: '\|\s*\d{4}\s+Form\s+10-[KQ]\s*\|\s*\d+\s*$'

eval:
  thresholds:
    statement_max_wer: 0.05         # measured 0.0227 on the statement fixture
    min_numeric_recall: 0.98        # measured 1.0
    table_min_f1: 0.98              # measured 1.0 (57 of 57 cells)